# The scans that do not belong in the merge-blocking path.
#
# SECURITY.md is candid that this tool executes code and spends money on the
# user's behalf — it shells out to Godot and Blender, runs arbitrary GDScript
# that can reach OS.execute(), and loads API keys from a project-local .env.
# None of that was scanned by anything.
#
# Deliberately NOT here: a third-party secret-scanning action. GitHub's own
# secret scanning with push protection is free on public repos, scans the whole
# history, and refuses the push instead of telling you about the key after it is
# already on the internet. It is a repository setting, not a workflow, and it
# is the better answer for the failure this repo has already had once (a
# committed API key). Turn it on under Settings → Code security.
name: security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Weekly, because a dependency becomes vulnerable while the code sits still.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit the dependencies this project actually resolves to
        # A clean venv with ONLY this package installed, so the audit sees the
        # runtime dependency tree and nothing the runner image happened to ship.
        # Auditing the job's own interpreter would report on setuptools and pip
        # instead, which tells you nothing about what a user installs.
        #
        # NO --strict, deliberately. builders-gate itself is always reported as
        # "not found on PyPI and could not be audited" — correct, nothing has
        # been published to an index yet — and --strict promotes exactly that
        # skip to a failure, so the job could never go green until the day the
        # package is published. The exit code still fails on an actual
        # vulnerability; --strict only governs skips.
        #
        # Revisit if builders-gate is ever published: at that point the skip
        # disappears and --strict becomes worth having, because a dependency
        # silently going unaudited is a real gap.
        run: |
          python -m venv .auditenv
          .auditenv/bin/python -m pip install --upgrade pip
          .auditenv/bin/python -m pip install .
          .auditenv/bin/python -m pip install pip-audit
          .auditenv/bin/python -m pip_audit

      - name: Audit the FLOORS — the oldest versions a user can legally install
        # THE STEP ABOVE CANNOT FAIL THE WAY THIS ONE CAN. `pip install .`
        # resolves to the newest release of everything, which is the version
        # least likely to have an open advisory, so that job stayed green while
        # the declared floors rotted to 23 known-vulnerable versions between
        # them — mcp 1.2.0, starlette 0.36.3 via an old fastapi cap, and Pillow
        # 10.0.0. A floor is what a constrained resolver actually serves, so it
        # is the version worth auditing.
        #
        # Separate venv, because this one deliberately installs OLD packages and
        # must not disturb the resolved-tree audit above.
        #
        # scripts/dep_floors.py derives the pins from pyproject rather than from
        # a second list that would drift out of sync on the first bump.
        #
        # `--group core` is the runtime dependencies, the dev extra AND
        # [build-system] requires. That last one is new: the script read
        # [project] only, so the build backend's floor was never audited, and
        # `setuptools>=68` sat there permitting four advisories at once
        # (PYSEC-2025-49, PYSEC-2026-1918, PYSEC-2026-3447,
        # GHSA-xmj3-9gf7-h52w) while this step reported green.
        run: |
          python -m venv .floorenv
          .floorenv/bin/python -m pip install --upgrade pip packaging
          .floorenv/bin/python scripts/dep_floors.py --group core > floors.txt
          echo "--- floors under audit ---"; cat floors.txt
          .floorenv/bin/python -m pip install pip-audit
          .floorenv/bin/python -m pip_audit -r floors.txt

      - name: Audit the optional extras' floors (advisory — does not gate)
        # THE OTHER EIGHT EXTRAS, AND WHY THIS STEP IS SHAPED THE WAY IT IS.
        #
        # stt, voice, record, stems, desktop, floor, build and web were left out
        # of the audit above for a reason recorded in dep_floors.py: several
        # pull native trees that do not resolve on a plain runner, and a gate
        # nobody can make green is a gate everyone learns to ignore. That
        # reasoning holds. What it should not have meant is NO coverage at all,
        # which is what it meant in practice.
        #
        # ONE PIN AT A TIME, because a single unresolvable requirement would
        # otherwise blind the whole step. pip-audit resolves a requirements
        # file as a unit and exits on the first failure, so auditing all eight
        # together means `faster-whisper==1.0` -- whose `av` dependency wants
        # libav headers it will not find here -- hides whatever the other seven
        # would have said. Audited singly, that one is a line of output and the
        # rest still report. (`--no-deps` is NOT the fix: measured against this
        # pip-audit it changes nothing, resolving and auditing each pin's
        # transitive tree either way.)
        #
        # ADVISORY, because the thing that breaks this step is a missing wheel
        # or a missing system header, not a vulnerability. A red X here means
        # "go read the log". The summary below is the part worth reading, and
        # unlike the old silence a real advisory on pyinstaller or playwright
        # now lands somewhere a person sees it.
        continue-on-error: true
        run: |
          .floorenv/bin/python scripts/dep_floors.py --group isolated > extras.txt
          echo "--- extra floors under audit (advisory) ---"; cat extras.txt
          .floorenv/bin/python - extras.txt <<'PY'
          import json, pathlib, subprocess, sys

          # CLASSIFY ON pip-audit's JSON, NOT ON ITS EXIT CODE OR ITS PROSE.
          # A first draft of this read the text output and treated any non-zero
          # exit that did not look like a resolver error as a finding -- so a
          # missing pip_audit module reported all eight floors as vulnerable.
          # JSON is unambiguous: if it parses there was an audit, and the
          # vulnerability lists in it are the result. Anything unparseable is
          # infrastructure, and says so.
          pins = [l.strip() for l in
                  pathlib.Path(sys.argv[1]).read_text().splitlines() if l.strip()]
          one = pathlib.Path("one.txt")
          flagged, unresolved = {}, {}

          for pin in pins:
              print(f"\n=== {pin} ===", flush=True)
              one.write_text(pin + "\n")
              run = subprocess.run(
                  [sys.executable, "-m", "pip_audit", "-r", str(one),
                   "-f", "json", "--progress-spinner", "off"],
                  capture_output=True, text=True)
              try:
                  report = json.loads(run.stdout)
              except (json.JSONDecodeError, ValueError):
                  reason = next(
                      (ln.strip() for ln in reversed(run.stderr.splitlines())
                       if "ERROR" in ln or "error:" in ln), "see log")
                  print(f"  NOT AUDITED (resolver/environment): {reason[:200]}")
                  unresolved[pin] = reason
                  continue

              hits = [(d["name"], d["version"], v.get("id", "?"),
                       ",".join(v.get("fix_versions") or []) or "none")
                      for d in report.get("dependencies", [])
                      for v in d.get("vulns", [])]
              if not hits:
                  n = len(report.get("dependencies", []))
                  print(f"  clean ({n} package(s) in this pin's tree)")
              else:
                  flagged[pin] = hits
                  for name, ver, vid, fix in hits:
                      print(f"  {name} {ver}  {vid}  fixed in: {fix}")

          print("\n================ summary ================")
          print(f"audited:    {len(pins) - len(unresolved)} of {len(pins)}")
          print(f"advisories: {' '.join(flagged) if flagged else 'none'}")
          print(f"not audited:{' ' + ' '.join(unresolved) if unresolved else ' none'}")
          for pin, hits in flagged.items():
              ids = ",".join(sorted({h[2] for h in hits}))
              print(f"::warning::extra floor {pin} has known advisories: {ids}")
          # Deliberately exit 0 even with findings: `continue-on-error` already
          # makes this step non-blocking, and exiting 0 keeps the step's own
          # annotation from reading as a failure of the job.
          PY

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # THE DEFAULT SUITE, after security-and-quality opened 277 alerts on
          # main in one pass. That is not a security posture, it is a wall
          # nobody reads — the same reason pyproject does not run ruff's full
          # rule set, written up above [tool.ruff]. A gate nobody can make green
          # is a gate everyone learns to ignore, and 277 is well past the point
          # where a real finding hides among the rest.
          #
          # Two things came out of triaging that first pass, which is the
          # argument for narrowing rather than deleting:
          #
          #   REAL      py/redos in src/bgate_core/qa/feedback.py. Exponential on a run
          #             of one letter — 41 m's took 26 seconds, and is_noise
          #             runs on every whisper segment, so humming into the mic
          #             was enough. Fixed.
          #   NOT REAL  py/command-line-injection, "Critical", in
          #             src/bgate_adapters/recorder.py. The command is a list, there
          #             is no shell, and the executable comes from
          #             shutil.which("ffmpeg") — the tainted value lands inside
          #             one argv element as `title=<name>` and cannot become an
          #             argument of its own.
          #
          # The path-expression class will keep firing: a tool whose whole job
          # is writing files into a game project the user named is going to look
          # like path injection to a static analyser forever. Those want
          # triaging and dismissing in the UI, per finding, not a config that
          # silences the rule everywhere.
          config: |
            paths-ignore:
              - tests

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

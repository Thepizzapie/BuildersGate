# Builds the downloadable Windows binary and attaches it to a release.
#
# Runs on every tag, and on demand. It also runs on pull requests that touch
# the packaging or the data trees — because the way this build breaks is silent:
# PyInstaller reports success and produces an exe that starts fine and 404s
# every asset, since src/bgate_ui/app.py and src/bgate_core/store/scaffold.py locate their
# data by walking up from __file__. Only the smoke test catches that, so the
# smoke test is the actual point of this job.
name: release-exe

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/bgate_ui/static/**"
      - "src/templates/**"
      - "pyproject.toml"
      - ".github/workflows/release-exe.yml"
  workflow_dispatch:

# READ BY DEFAULT, AND WRITE IN EXACTLY ONE JOB. This workflow runs on
# pull_request, where the checked-out code is the PR's, so a token that can
# push must never be live in a job that executes it. The split is the control:
#
#   guard    checks tag/pyproject/CHANGELOG agree.          read
#   build    npm, PyInstaller, Inno Setup, signing.         read   <- PR's code
#   publish  downloads build's artifact and publishes it.   write  <- tags only
#
# `publish` runs no packaging script and no dependency install; its inputs are
# one uploaded artifact and CHANGELOG.md. That is what lets `build` sit at
# read while still producing the files a release needs.
#
# THIRD-PARTY ACTIONS ARE PINNED BY COMMIT SHA, with the version they were at
# in a trailing comment. A tag is a mutable pointer the action's owner can move
# after review, and this is the workflow holding Authenticode signing
# credentials, so a retag here would reach the one job that can both sign and
# publish. `actions/*` and `github/*` stay on major tags: those are GitHub's
# own, pinned by the same org that runs the runner, and Dependabot moves them.
permissions:
  contents: read

jobs:
  # THE JOB THAT SHOULD HAVE EXISTED TWO RELEASES AGO. v0.1.28 and v0.1.29 were
  # both tagged against a tree whose pyproject still said 0.1.27, and CHANGELOG
  # .md has no section for either of them — so the release-notes step below fell
  # through to its "no changelog entry" fallback twice, and shipped two releases
  # described by a link to a file that does not mention them.
  #
  # Every one of those facts is knowable in three seconds, before anything is
  # built or signed. Failing here costs a re-tag. Failing after the notes step
  # costs a published release that has to be edited by hand.
  #
  # There is no job-level `if:` on purpose. A skipped job SKIPS everything that
  # `needs:` it, so gating the job itself would silently disable the build on
  # the PR and workflow_dispatch paths. The job always runs; the check inside it
  # is what is tag-only.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The tag, pyproject and the changelog must agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - "${GITHUB_REF_NAME}" <<'PY'
          import pathlib, re, sys, tomllib

          tag = sys.argv[1]
          version = tag.lstrip("v")
          declared = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          problems = []
          if declared != version:
              problems.append(
                  f"tag {tag} does not match pyproject version {declared}. "
                  f"Bump the version and re-tag, or tag the commit that has it.")
          if not re.search(rf"^## \[{re.escape(version)}\]", changelog, re.M):
              problems.append(
                  f"CHANGELOG.md has no '## [{version}]' section. The release "
                  f"body is built from it, so without one the release ships "
                  f"describing nothing.")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"{tag} == pyproject {declared} == CHANGELOG [{version}]")
          PY

  build:
    needs: [guard]
    runs-on: windows-latest
    timeout-minutes: 30
    # READ ONLY, AND THAT IS THE WHOLE POINT OF THE `publish` JOB BELOW. This
    # job runs the checked-out code -- on a pull_request run, the PR's own
    # code, including packaging/build_exe.py and the frontend's npm tree. It
    # used to hold `contents: write`, because "Attach to the release" lived
    # here and that step needs it. The step was gated on a tag; the permission
    # could not be, so every PR build ran untrusted code with a token that
    # could push. GitHub downgrades a FORK's token to read whatever the
    # workflow says, which left branch PRs from collaborators holding the real
    # thing. The attach step now lives in `publish`, which touches no PR code.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # THE EXE BUNDLES src/bgate_ui/static WHOLESALE, and a fresh checkout does not
      # have one: that tree is generated and only its dist/ is committed. Without
      # this the exe ships a dashboard with no index.html, which build_exe.py now
      # refuses before spending the PyInstaller run.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the front end
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # NO `pip install` STEP. build_exe.py builds inside its own venv holding
      # exactly what pyproject declares, so the runner's interpreter is not
      # part of the product and this job and a developer's laptop produce the
      # same bundle. That was not true before: PyInstaller bundles whatever the
      # interpreter running it can import, and one developer machine with an
      # unrelated azure-storage-blob installed shipped azure.core,
      # opentelemetry, grpc and protobuf inside the release — 59 MB against
      # this runner's 37 for the same commit.

      # Inno Setup builds the install wizard. The `innosetup` Chocolatey package
      # is 6.x, which is what the script needs — it uses directives that do not
      # exist in 5 (PrivilegesRequiredOverridesAllowed,
      # ArchitecturesAllowed=x64compatible). Deliberately NOT pinned to a patch
      # version: a pin to a build Chocolatey later drops fails this job for a
      # reason that has nothing to do with the release.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, smoke-test and package the app
        # build_exe.py boots the frozen binary in server mode and fetches real
        # files out of it, THEN zips, THEN compiles the installer. A build that
        # cannot serve /static/app.css fails before anything is packaged, which
        # matters most for the installer: it is a far better way to distribute a
        # broken build than a zip is.
        run: python packaging/build_exe.py --installer

      # ── signing ────────────────────────────────────────────────────────────
      # Unsigned, this binary is blocked twice over: Defender's ML quarantined
      # the first release, and Smart App Control refuses to launch it at all
      # ("we can't confirm who published BuildersGate.exe"). SAC is default-on
      # for clean Windows 11 installs, so this is not a niche problem.
      #
      # Since June 2023 the CA/Browser Forum requires code-signing private keys
      # to live on FIPS 140-2 Level 2 hardware, so the old trick of dropping a
      # .pfx into repo secrets is no longer possible for a newly issued cert.
      # The key has to stay in a cloud HSM and the runner calls out to it.
      #
      # This step is inert until the secrets exist, so the build keeps working
      # for anyone without a certificate.
      - name: Sign the executable
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          env.SIGN_ENDPOINT != ''
        env:
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293  # v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          # Sign the launcher AND the PyInstaller bootloader DLLs it loads —
          # SAC evaluates what gets loaded, not only what gets double-clicked.
          files-folder: dist/BuildersGate
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ORDER MATTERS FROM HERE DOWN. The zip and the installer both CONTAIN the
      # binaries, so both have to be rebuilt after those binaries are signed —
      # a signature applied to dist/BuildersGate/ does not reach a copy made
      # before it. Sign the app, then re-zip, then re-compile the installer,
      # then sign the installer itself.
      - name: Re-package after signing
        if: startsWith(github.ref, 'refs/tags/')
        # Idempotent when signing was skipped: the same two artifacts are
        # rebuilt from the same tree, with the checksums refreshed.
        run: |
          python -c "import sys; sys.path.insert(0,'packaging'); import build_exe; build_exe.package()"
          python -c "import sys; sys.path.insert(0,'packaging'); import build_exe; build_exe.installer()"

      - name: Sign the installer
        # A signed app inside an unsigned installer is the worst of both: the
        # thing the user actually double-clicks is the setup.exe, and that is
        # what SmartScreen judges.
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          env.SIGN_ENDPOINT != ''
        env:
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293  # v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          # dist/ itself, NOT recursed — the only .exe directly in it is the
          # installer. The app's own binaries are a directory deeper and were
          # signed by the step above.
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Report what was built
        shell: bash
        run: |
          ls -la dist/
          echo "zip:   $(( $(stat -c%s dist/BuildersGate-windows.zip) / 1048576 )) MB"
          echo "setup: $(( $(stat -c%s dist/BuildersGate-setup.exe) / 1048576 )) MB"
          cat dist/BuildersGate-windows.zip.sha256
          cat dist/BuildersGate-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BuildersGate-windows
          path: |
            dist/BuildersGate-setup.exe
            dist/BuildersGate-setup.exe.sha256
            dist/BuildersGate-windows.zip
            dist/BuildersGate-windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # THE ONLY JOB THAT CAN WRITE, AND IT NEVER RUNS THE PR'S CODE.
  #
  # Splitting this out is what lets `build` above run at `contents: read`.
  # Everything here operates on the artifact `build` uploaded plus CHANGELOG.md
  # from the checkout -- no packaging script, no npm install, no PyInstaller.
  #
  # The job-level `if:` IS safe here, unlike on `guard` and `build`: a skipped
  # job skips everything that `needs:` it, and nothing needs `publish`. That
  # also means the two steps below no longer carry their own tag conditions --
  # the job gate replaces them.
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # CHANGELOG.md only -- the release body is built from it. Shallow,
      # because nothing here needs history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Explicit, rather than trusting whichever `python` the runner image
      # happens to put on PATH: the release-notes step below invokes `python`
      # by name, and on ubuntu images that has been `python3` only before now.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Back into dist/, which is where the two steps below still expect them.
      # upload-artifact@v4 roots the archive at the least common ancestor of
      # the paths it was given -- all four were `dist/...`, so the artifact
      # holds the four files at its top level and `path: dist` restores the
      # layout the build job had.
      - uses: actions/download-artifact@v4
        with:
          name: BuildersGate-windows
          path: dist

      - name: Report what was downloaded
        run: |
          ls -la dist/
          cat dist/BuildersGate-windows.zip.sha256
          cat dist/BuildersGate-setup.exe.sha256

      - name: Release notes, from the changelog
        # WITHOUT THIS THE RELEASE BODY IS THE TAG ANNOTATION, which is one line
        # somebody typed at 2am — v0.1.27 shipped a 10k-line release described as
        # "completion routing, notifications, and one settings surface" and
        # nothing else. The changelog entry already exists and is already the
        # thing worth reading, so the release should BE it rather than link to it.
        shell: bash
        run: |
          python - "${GITHUB_REF_NAME}" <<'PY'
          import pathlib, re, sys

          tag = sys.argv[1]
          version = tag.lstrip("v")
          repo = "Thepizzapie/BuildersGate"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          # This version's section, up to the next version heading. Keep a
          # Changelog puts the newest first, so a greedy match would swallow
          # every earlier release into one body.
          found = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.S | re.M)
          if found:
              body = found.group(1).strip()
          else:
              # A tag with no changelog entry is a mistake, but failing here
              # would throw away an exe that is already built and signed. Say so
              # loudly in the log and ship something honest instead of nothing.
              print(f"::warning::CHANGELOG.md has no section for {version}")
              body = (f"No changelog entry for {version} — see "
                      f"https://github.com/{repo}/blob/main/CHANGELOG.md")

          body += (f"\n\n---\n\nFull diff: "
                   f"https://github.com/{repo}/compare/...{tag}\n")
          pathlib.Path("RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          print(f"release notes: {len(body)} chars from CHANGELOG.md")
          PY

      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          body_path: RELEASE_NOTES.md
          # THE INSTALLER GOES FIRST BECAUSE IT IS THE DEFAULT DOWNLOAD, and it
          # has to be in this list at all: v0.1.41 built the setup.exe, signed
          # nothing, checksummed it, uploaded it as a CI artifact that expires
          # in 30 days -- and then published a release without it, because this
          # list named only the zip. The build log said "setup: 75 MB" and the
          # release page had no installer on it. Nothing failed; the file was
          # simply not asked for.
          #
          # fail_on_unmatched_files below is what makes that unrepeatable: any
          # artifact named here and missing now fails the publish instead of
          # shipping a release quietly short of one.
          files: |
            dist/BuildersGate-setup.exe
            dist/BuildersGate-setup.exe.sha256
            dist/BuildersGate-windows.zip
            dist/BuildersGate-windows.zip.sha256
          fail_on_unmatched_files: true

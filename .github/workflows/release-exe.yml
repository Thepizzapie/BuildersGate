# Builds the downloadable Windows binary and attaches it to a release.
#
# Runs on every tag, and on demand. It also runs on pull requests that touch
# the packaging or the data trees — because the way this build breaks is silent:
# PyInstaller reports success and produces an exe that starts fine and 404s
# every asset, since bgate_ui/app.py and bgate_core/scaffold.py locate their
# data by walking up from __file__. Only the smoke test catches that, so the
# smoke test is the actual point of this job.
name: release-exe

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "bgate_ui/static/**"
      - "templates/**"
      - "bgate_engine/**"
      - "pyproject.toml"
      - ".github/workflows/release-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # THE JOB THAT SHOULD HAVE EXISTED TWO RELEASES AGO. v0.1.28 and v0.1.29 were
  # both tagged against a tree whose pyproject still said 0.1.27, and CHANGELOG
  # .md has no section for either of them — so the release-notes step below fell
  # through to its "no changelog entry" fallback twice, and shipped two releases
  # described by a link to a file that does not mention them.
  #
  # Every one of those facts is knowable in three seconds, before anything is
  # built or signed. Failing here costs a re-tag. Failing after the notes step
  # costs a published release that has to be edited by hand.
  #
  # There is no job-level `if:` on purpose. A skipped job SKIPS everything that
  # `needs:` it, so gating the job itself would silently disable the build on
  # the PR and workflow_dispatch paths. The job always runs; the check inside it
  # is what is tag-only.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The tag, pyproject and the changelog must agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - "${GITHUB_REF_NAME}" <<'PY'
          import pathlib, re, sys, tomllib

          tag = sys.argv[1]
          version = tag.lstrip("v")
          declared = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          problems = []
          if declared != version:
              problems.append(
                  f"tag {tag} does not match pyproject version {declared}. "
                  f"Bump the version and re-tag, or tag the commit that has it.")
          if not re.search(rf"^## \[{re.escape(version)}\]", changelog, re.M):
              problems.append(
                  f"CHANGELOG.md has no '## [{version}]' section. The release "
                  f"body is built from it, so without one the release ships "
                  f"describing nothing.")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"{tag} == pyproject {declared} == CHANGELOG [{version}]")
          PY

  build:
    needs: [guard]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # THE EXE BUNDLES bgate_ui/static WHOLESALE, and a fresh checkout does not
      # have one: that tree is generated and only its dist/ is committed. Without
      # this the exe ships a dashboard with no index.html, which build_exe.py now
      # refuses before spending the PyInstaller run.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the front end
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install pyinstaller>=6.14

      - name: Build and smoke-test the app
        # build_exe.py boots the frozen binary in server mode and fetches real
        # files out of it, THEN zips. A build that cannot serve /static/app.css
        # fails here and never gets packaged.
        run: python packaging/build_exe.py

      # ── signing ────────────────────────────────────────────────────────────
      # Unsigned, this binary is blocked twice over: Defender's ML quarantined
      # the first release, and Smart App Control refuses to launch it at all
      # ("we can't confirm who published BuildersGate.exe"). SAC is default-on
      # for clean Windows 11 installs, so this is not a niche problem.
      #
      # Since June 2023 the CA/Browser Forum requires code-signing private keys
      # to live on FIPS 140-2 Level 2 hardware, so the old trick of dropping a
      # .pfx into repo secrets is no longer possible for a newly issued cert.
      # The key has to stay in a cloud HSM and the runner calls out to it.
      #
      # This step is inert until the secrets exist, so the build keeps working
      # for anyone without a certificate.
      - name: Sign the executable
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          env.SIGN_ENDPOINT != ''
        env:
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          # Sign the launcher AND the PyInstaller bootloader DLLs it loads —
          # SAC evaluates what gets loaded, not only what gets double-clicked.
          files-folder: dist/BuildersGate
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Re-zip after signing
        if: startsWith(github.ref, 'refs/tags/')
        # The zip made during the build predates the signatures, so rebuild it
        # and refresh the checksum. Idempotent when signing was skipped.
        run: python -c "import sys; sys.path.insert(0,'packaging'); import build_exe; build_exe.package()"

      - name: Report what was built
        shell: bash
        run: |
          ls -la dist/
          echo "zip: $(( $(stat -c%s dist/BuildersGate-windows.zip) / 1048576 )) MB"
          cat dist/BuildersGate-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BuildersGate-windows
          path: |
            dist/BuildersGate-windows.zip
            dist/BuildersGate-windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Release notes, from the changelog
        # WITHOUT THIS THE RELEASE BODY IS THE TAG ANNOTATION, which is one line
        # somebody typed at 2am — v0.1.27 shipped a 10k-line release described as
        # "completion routing, notifications, and one settings surface" and
        # nothing else. The changelog entry already exists and is already the
        # thing worth reading, so the release should BE it rather than link to it.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - "${GITHUB_REF_NAME}" <<'PY'
          import pathlib, re, sys

          tag = sys.argv[1]
          version = tag.lstrip("v")
          repo = "Thepizzapie/BuildersGate"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          # This version's section, up to the next version heading. Keep a
          # Changelog puts the newest first, so a greedy match would swallow
          # every earlier release into one body.
          found = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.S | re.M)
          if found:
              body = found.group(1).strip()
          else:
              # A tag with no changelog entry is a mistake, but failing here
              # would throw away an exe that is already built and signed. Say so
              # loudly in the log and ship something honest instead of nothing.
              print(f"::warning::CHANGELOG.md has no section for {version}")
              body = (f"No changelog entry for {version} — see "
                      f"https://github.com/{repo}/blob/main/CHANGELOG.md")

          body += (f"\n\n---\n\nFull diff: "
                   f"https://github.com/{repo}/compare/...{tag}\n")
          pathlib.Path("RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          print(f"release notes: {len(body)} chars from CHANGELOG.md")
          PY

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/BuildersGate-windows.zip
            dist/BuildersGate-windows.zip.sha256
          fail_on_unmatched_files: true

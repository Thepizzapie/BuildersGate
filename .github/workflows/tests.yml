# The test suite. Nothing ran it in CI until now — the only workflow in this
# repo built the exe — so every guarantee in tests/ held exactly as long as
# whoever last touched the code remembered to run pytest locally.
#
# Windows, because that is the supported platform and a good deal of this code
# is about Windows specifically: process trees, CREATE_NO_WINDOW, WebView2, the
# path handling around .bgate. A green run on Linux would prove less.
name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # node is what tests/test_shell_adjust.py hands the shell's inline
      # scripts to. Without it those checks SKIP rather than fail, which would
      # quietly retire the one guard that the dashboard still parses.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Route modules must all import
        # The suite covers this too, but a missing route module is the failure
        # that looks healthiest from the outside, so it gets its own step with
        # BGATE_STRICT_ROUTES on: import failure becomes a hard error.
        env:
          BGATE_STRICT_ROUTES: "1"
        run: |
          python -c "import os, tempfile; d = tempfile.mkdtemp(); os.environ['BGATE_ROOT'] = d; from bgate_core import db; db.connect(d); from bgate_ui.app import app; from fastapi.testclient import TestClient; body = TestClient(app).get('/api/routes/status').json(); print(body); assert body['ok'], body"

      - name: pytest
        run: python -m pytest -q

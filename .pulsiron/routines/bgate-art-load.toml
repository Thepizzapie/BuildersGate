name = 'bgate-art-load'
description = "The choices the art panel offers, read live from the dashboard: task kinds, sizes, qualities, configured providers and the project's pinned references."
agents = 'yes'
keywords = ['art', 'options', 'refs', 'providers', 'panel']

[[step]]
name = 'load'
run = 'python {repo}/tools/panel_api.py art-options --want all --out ".pulsiron/feeds/art-load.json"'
timeout_secs = 30

[outputs]
summary_file = '.pulsiron/feeds/art-load.json'

name = 'bgate-music-play'
description = "Open one music take in this machine's default audio player. A panel cannot play sound — there is no audio widget in the panel schema — so auditioning happens here."
agents = 'yes'
keywords = ['music', 'play', 'audition', 'listen', 'preview']

[[input]]
name = 'take'
description = "A label like '#385 office-night rev2'"
required = true

[[step]]
name = 'play'
run = 'python {repo}/tools/panel_api.py play --take "{take}"'
timeout_secs = 30

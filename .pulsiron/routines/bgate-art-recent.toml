name = 'bgate-art-recent'
description = "The images this project generated most recently, as absolute paths — what the panel's grid and file browser draw."
agents = 'yes'
keywords = ['art', 'recent', 'gallery', 'images', 'panel']

[[input]]
name = 'limit'
description = 'How many'
default = '12'

[[step]]
name = 'recent'
run = 'python {repo}/tools/panel_api.py art-recent --limit {limit} --out ".pulsiron/feeds/art-recent.json"'
timeout_secs = 30

[outputs]
summary_file = '.pulsiron/feeds/art-recent.json'

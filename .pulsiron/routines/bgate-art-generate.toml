name = 'bgate-art-generate'
description = 'Generate one painted image through the running Builders Gate dashboard and register it as a reviewable artifact. Costs real money per image.'
agents = 'yes'
keywords = ['image', 'art', 'sprite', 'texture', 'prop', 'generate']

[[input]]
name = 'prompt'
description = 'What to paint.'
required = true

[[input]]
name = 'filename'
description = 'Blank names it from the prompt'
default = ''

[[input]]
name = 'kind'
description = 'Task kind'
default = ''

[[input]]
name = 'size'
description = 'Pixel size'
default = '1024x1024'

[[input]]
name = 'quality'
description = 'low | medium | high'
default = 'medium'

[[input]]
name = 'provider'
description = 'auto picks whichever key is configured'
default = 'auto'

[[input]]
name = 'transparent'
description = 'Cut the background to real alpha'
default = 'false'

[[input]]
name = 'tileable'
description = 'Mirrored seam pass, for textures'
default = 'false'

[[input]]
name = 'ref'
description = 'A pinned reference to condition on'
default = ''

[[step]]
name = 'generate'
run = 'python {repo}/scripts/panel_api.py art --prompt "{prompt}" --filename "{filename}" --kind "{kind}" --size "{size}" --quality "{quality}" --provider "{provider}" --transparent "{transparent}" --tileable "{tileable}" --refs "{ref}"'
timeout_secs = 900

[project]
name = "builders-gate-floor-assets"
version = "0.1.43"
description = "Studio-floor paintings and ambience for the Builders Gate dashboard (optional)."
readme = "README.md"
requires-python = ">=3.11"

[build-system]
# Same floor as the root pyproject, and for the same reason: setuptools
# 68 carries four advisories (PYSEC-2025-49, PYSEC-2026-1918,
# PYSEC-2026-3447, GHSA-xmj3-9gf7-h52w). This package is published
# separately, so its build backend is its own exposure.
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["builders_gate_floor_assets"]

[tool.setuptools.package-data]
builders_gate_floor_assets = ["img/**/*", "audio/**/*"]

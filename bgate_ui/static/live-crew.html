<script>
(function () {
  var SHEETS = "/static/img/agents/";
  var POLL   = 3000;
  var DEMO   = /[?&]demo=1/.test(location.search);
  var MAXJOB = 4;

  var floor = document.getElementById("floor");
  var jobs  = document.getElementById("jobs");
  var qb    = document.getElementById("qblocks");

  var SEATS = Object.keys(window.AGENT_NAMES || {
    director:1, narrative:1, gameplay:1, art:1, qa:1, tech:1, audio:1
  });

  /* build the roster once; only classes and text change afterwards */
  var cells = {};
  SEATS.forEach(function (seat) {
    var d = document.createElement("div");
    d.className = "crew off";
    var cell = document.createElement("div");
    cell.className = "cell";
    var sp = document.createElement("i");
    sp.className = "idle";
    sp.style.backgroundImage = "url('" + SHEETS + seat + "_talk.png')";
    cell.appendChild(sp);
    var lamp = document.createElement("i");
    lamp.className = "lamp";
    var nm = document.createElement("canvas");
    nm.dataset.text  = window.agentName ? window.agentName(seat) : seat;
    nm.dataset.scale = "2";
    nm.dataset.ink   = "bone";
    d.append(cell, lamp, nm);
    floor.appendChild(d);
    cells[seat] = { root: d, sprite: sp, name: nm };
    PX.paint(nm);
  });

  function setBusy(seat, busy) {
    var c = cells[seat];
    if (!c) return;
    c.root.className = "crew " + (busy ? "on" : "off");
    var want = busy ? "walk" : "idle";
    if (c.sprite.className !== want) {
      c.sprite.className = want;
      c.sprite.style.backgroundImage =
        "url('" + SHEETS + seat + (busy ? "_walk.png" : "_talk.png") + "')";
    }
  }

  function renderJobs(list) {
    jobs.innerHTML = "";
    if (!list.length) {
      var e = document.createElement("div");
      e.className = "job empty";
      var c = document.createElement("canvas");
      c.dataset.text = "SHOP IS QUIET"; c.dataset.scale = "2"; c.dataset.ink = "bone"; c.dataset.track = "1";
      e.appendChild(c); jobs.appendChild(e); PX.paint(c);
      return;
    }
    list.slice(0, MAXJOB).forEach(function (j) {
      var row = document.createElement("div"); row.className = "job";
      var pip = document.createElement("i"); pip.className = "pip";
      var col = document.createElement("div"); col.className = "col";
      var who = document.createElement("canvas");
      who.dataset.text = (window.agentName ? window.agentName(j.seat) : j.seat);
      who.dataset.scale = "2"; who.dataset.ink = "blue"; who.dataset.track = "1";
      var what = document.createElement("canvas");
      what.dataset.text = (j.title || "").slice(0, 34);
      what.dataset.scale = "2"; what.dataset.ink = "bone"; what.dataset.track = "0";
      col.append(who, what); row.append(pip, col); jobs.appendChild(row);
      PX.paint(who); PX.paint(what);
    });
  }

  function renderQueue(running, waiting) {
    qb.innerHTML = "";
    var total = Math.max(10, running + waiting);
    var shown = Math.min(total, 14);
    for (var i = 0; i < shown; i++) {
      var b = document.createElement("i");
      if (i < running) b.className = "r";
      else if (i < running + waiting) b.className = "f";
      qb.appendChild(b);
    }
    PX.paint(document.getElementById("qcount"), String(running + waiting));
  }

  function getJSON(u) {
    return fetch(u, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status); return r.json();
    });
  }

  function demo() {
    return Promise.resolve({
      jobs: [
        { seat: "art",      title: "BLENDER ASSET SWEEP" },
        { seat: "tech",     title: "GODOT IMPORT EVIDENCE" },
        { seat: "qa",       title: "SEAT ROUTING GATE" }
      ],
      waiting: 6
    });
  }

  function live() {
    return getJSON("/api/agents").then(function (res) {
      var running = (res.agents || []).filter(function (a) { return a.state === "running"; });
      return Promise.all(running.map(function (a) {
        return getJSON("/api/queue/" + a.item_id)
          .then(function (d) { return { seat: d.seat || "", title: d.title || "" }; })
          .catch(function () { return null; });
      })).then(function (rows) {
        return { jobs: rows.filter(Boolean), waiting: 0 };
      });
    });
  }

  function tick() {
    (DEMO ? demo() : live()).then(function (d) {
      var busy = {};
      d.jobs.forEach(function (j) { if (j.seat) busy[j.seat] = 1; });
      SEATS.forEach(function (s) { setBusy(s, !!busy[s]); });
      renderJobs(d.jobs);
      renderQueue(d.jobs.length, d.waiting);
      PX.paint(document.getElementById("hcount"), d.jobs.length + " WORKING");
    }).catch(function () {
      SEATS.forEach(function (s) { setBusy(s, false); });
      renderJobs([]);
      PX.paint(document.getElementById("hcount"), "NO LINK");
    });
  }

  tick();
  setInterval(tick, POLL);   /* polling, not rAF - nothing animates from JS */
})();
</script>

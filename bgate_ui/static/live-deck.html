      row.append(pip, col); jobs.appendChild(row);
      txt(col, window.agentName ? window.agentName(j.seat) : j.seat, "2", "blue", "1");
      txt(col, (j.title || "").slice(0, 40), "2", "bone", "0");
    });
  }

  /* ── CRITIQUE ──────────────────────────────────────────────────────────── */
  function drawCritique() {
    var c = state.critique, board = document.getElementById("b-critique");
    var shot = document.getElementById("shot"), bars = document.getElementById("bars");
    var note = document.getElementById("artNote"); note.innerHTML = ""; bars.innerHTML = "";
    /* Only ever touch the v-* classes here. Setting className wholesale wiped
       the `on` class that show() adds, so the board went blank the moment data
       landed. */
    function verdictClass(cls) {
      board.classList.remove("v-pass", "v-fail", "v-none");
      if (cls) board.classList.add(cls);
    }
    if (!c) {
      verdictClass(null);
      PX.paint(document.getElementById("artName"), "NOTHING YET");
      PX.paint(document.getElementById("artMeta"), "");
      PX.paint(document.getElementById("badgeTxt"), "");
      shot.removeAttribute("src"); return;
    }
    /* Badge off `status`, with `verdict` as the richer overlay when it exists.
       verdict is written only by an art-QA agent calling art_qa_verdict, which
       is discretionary — it is empty on every row in this project. status is
       the field that actually moves (approved / rejected / candidate), so
       leading on verdict left a blank where the headline should be.
       verdict still wins when present: it is the stronger statement, and a
       fail also flips status to rejected.

       CAVEAT WORTH KNOWING BEFORE TRUSTING THIS ON CAMERA: with the art gate
       set to "none", register() auto-approves at insert, so a new card reads
       APPROVED within a second and NO HUMAN HAS LOOKED AT IT. We cannot tell
       auto from hand-approved here — the card's `reviewer` is the art-QA
       reviewer (empty on every row, same cause as verdict), not the approval
       actor; `reviewed_by` is not exposed on the card. So this badge reports
       the pipeline's status truthfully and claims nothing about who decided.
       If that distinction is ever needed on stream, the endpoint has to carry
       reviewed_by — do not try to infer it from `reviewer`. */
    var v = (c.verdict || "").toLowerCase();
    var s = (c.status  || "").toLowerCase();
    var badge = v === "pass" ? { t:"PASS", k:"pass" }
              : v === "fail" ? { t:"FAIL", k:"fail" }
              : s === "approved"  ? { t:"APPROVED",  k:"pass" }
              : s === "rejected"  ? { t:"REJECTED",  k:"fail" }
              : s === "candidate" ? { t:"CANDIDATE", k:"" }
              : { t:(s || "UNJUDGED").toUpperCase(), k:"" };
    verdictClass(badge.k === "pass" ? "v-pass" : badge.k === "fail" ? "v-fail" : "v-none");
    document.getElementById("badge").className = "badge " + badge.k;
    PX.paint(document.getElementById("badgeTxt"), badge.t);

    /* preview_url verbatim from the server; `path` is never rendered */
    if (c.preview_url) { shot.src = c.preview_url; shot.style.display = "block"; }
    else { shot.removeAttribute("src"); shot.style.display = "none"; }

    var nm = String(c.logical_name || "UNTITLED");
    if (c.revision) nm += " R" + c.revision;
    PX.paint(document.getElementById("artName"), nm.slice(0, 20));
    var seat = c.seat || "";
    PX.paint(document.getElementById("artMeta"),
      ((c.kind || "") + (seat ? " - " + (window.agentName ? window.agentName(seat) : seat) : "")).slice(0, 30));

    if (v === "pass" || v === "fail") {
      var lit = Math.round(Math.max(0, Math.min(100, c.score || 0)) / 10);
      for (var i = 0; i < 10; i++) {
        var b = document.createElement("i"); if (i < lit) b.className = "on"; bars.appendChild(b);
      }
    }
    wrap(c.note || (v ? "" : "NO QA VERDICT ON THIS ONE"), 44, 3).forEach(function (l) {
      txt(note, l, "2", "bone", "0");
    });
  }

  /* ── FEED ──────────────────────────────────────────────────────────────── */
  function drawFeed() {
    var f = document.getElementById("feed"); f.innerHTML = "";
    if (!state.feed.length) {
      var e = document.createElement("div"); e.className = "row empty";
      f.appendChild(e); txt(e, "NOTHING LOGGED YET", "2", "bone", "1"); return;
    }
    state.feed.slice(0, 5).forEach(function (a) {
      var row = document.createElement("div"); row.className = "row";
      var chit = document.createElement("i"); chit.className = "chit";
      var col = document.createElement("div"); col.className = "col";
      row.append(chit, col); f.appendChild(row);
      var who = a.seat ? (window.agentName ? window.agentName(a.seat) : a.seat) : (a.actor || "SYSTEM");
      txt(col, who, "2", "blue", "1");
      wrap(a.summary, 44, 1).forEach(function (l) { txt(col, l, "2", "bone", "0"); });
    });
  }

  /* ── data ──────────────────────────────────────────────────────────────── */
  function pullCrew() {
    return getJSON("/api/agents").then(function (res) {
      var running = (res.data ? res.data.agents : res.agents) || [];
      running = running.filter(function (a) { return a.state === "running"; });
      return Promise.all(running.map(function (a) {
        return getJSON("/api/queue/" + a.item_id)
          .then(function (d) { var x = d.data || d; return { seat:x.seat || "", title:x.title || "" }; })
          .catch(function () { return null; });
      })).then(function (rows) {
        rows = rows.filter(Boolean);
        var busy = {}; rows.forEach(function (r) { if (r.seat) busy[r.seat] = 1; });
        state.crew = { jobs:rows, busy:busy };
      });
    });
  }
  function pullCritique() {
    /* cursor-gated: send the last seq we drew and trust `new` */
    return getJSON("/api/critique?since=" + critCursor).then(function (env) {
      var d = env.data || {};
      if (!d.new) return;
      critCursor = d.seq || critCursor;
      state.critique = d.latest || null;
      /* A genuinely new artifact INTERRUPTS the rotation. The first load does
         not — on startup the head card is just whatever already existed, and
         hijacking the deck for it would fire a "new artwork" beat for
         something hours old. */
      if (!firstCritique) takeover = true;
      firstCritique = false;
    });
  }
  /* ── LOOKING AT ────────────────────────────────────────────────────────────
     What the console shows as "<seat> - LOOKING AT": images the agent examined
     this phase. These are SCRAPED paths (phases.py), not registered artifacts —
     no id, no seq, so there is no cursor and this board is a live readout
     rather than an event. That is the right shape for it: it answers "what is
     on the agent's screen now", which the artifact table can never answer.

     PATHS ARE NEVER RENDERED. They are used only to build /api/preview?rel=,
     url-encoded, and any path that is not project-relative is DROPPED — some
     generators emit absolute paths and /api/preview accepts either, so an
     unguarded one would put the streamer's directory tree on camera. */
  function isRelSafe(p) {
    return !!p && !/^[a-zA-Z]:[\\/]/.test(p) && !/^[\\/]/.test(p) && p.indexOf("..") === -1;
  }
  function pullLooking() {
    /* Never let two of these overlap, and never run one more often than
       SLOW_POLL. A 27s response on a 4s tick means ~6 in flight at once, each
       rebuilding a 276KB payload — the overlay would be the load. */
    if (slowInflight) return Promise.resolve();
    if (Date.now() - slowLast < SLOW_POLL) return Promise.resolve();
    slowInflight = true;
    slowLast = Date.now();
    return getJSON("/api/console/state").then(function (env) {
      var d = env.data || env;
      var items = {}; (d.items || []).forEach(function (i) { items[i.id] = i; });
      var best = null;
      Object.keys(d.phases || {}).forEach(function (itemId) {
        var phases = d.phases[itemId] || [];
        for (var i = phases.length - 1; i >= 0; i--) {
          var seen = phases[i].seen || [];
          for (var j = seen.length - 1; j >= 0; j--) {
            if (!isRelSafe(seen[j])) continue;
            if (!best) {
              var it = items[itemId] || {};
              best = { rel: seen[j], item: itemId, seat: it.seat || "", title: it.title || "" };
            }
            break;
          }
          if (best) break;
        }
      });
      state.looking = best;
    }).then(function () { slowInflight = false; },
            function (e) { slowInflight = false; throw e; });
  }

  function pullFeed() {
    return getJSON("/api/activity?limit=5").then(function (env) {
      state.feed = env.data || [];
    });
  }

  function refresh() {
    if (DEMO) {
      state.crew = { jobs:[{seat:"art",title:"BLENDER ASSET SWEEP"},{seat:"tech",title:"GODOT IMPORT EVIDENCE"}],
                     busy:{art:1,tech:1} };
      state.critique = { logical_name:"I100C_PM_PALADIN", revision:1, kind:"texture",
                         seat:"art", verdict:"", score:0, note:"", preview_url:"" };
      state.feed = [{seat:"director",summary:"item 264 dispatched",actor:"Sam"},
                    {seat:"art",summary:"texture rejected, retrying",actor:""}];
      paint(); return;
    }
    Promise.all([
      pullCrew().catch(function () {}),
      pullLooking().catch(function () {}),
      pullCritique().catch(function () {}),
      pullFeed().catch(function () {})
    ]).then(paint);
  }

  /* The header counts come from state, so they have to be repainted when DATA
     lands as well as when the board turns — otherwise the first render shows
     "0 WORKING" next to a job list that clearly has one. */
  function updateHeader() {
    var key = BOARDS[idx].key;
    PX.paint(elTitle, BOARDS[idx].title);
    var sub = key === "crew"     ? (state.crew.jobs.length + " WORKING")
            : key === "looking"  ? (state.looking ? "ITEM " + state.looking.item : "")
            : key === "critique" ? (state.critique ? "SEQ " + (state.critique.seq || critCursor) : "")
            : (state.feed.length + " RECENT");
    PX.paint(elSub, sub);
  }

  function drawLooking() {
    var L = state.looking;
    var shot = document.getElementById("lookShot");
    var t = document.getElementById("lookTitle"); t.innerHTML = "";
    if (!L) {
      shot.removeAttribute("src");
      PX.paint(document.getElementById("lookWho"), "NOBODY LOOKING");
      PX.paint(document.getElementById("lookItem"), "");
      return;
    }
    shot.src = "/api/preview?rel=" + encodeURIComponent(L.rel);
    shot.style.display = "block";
    var who = L.seat ? (window.agentName ? window.agentName(L.seat) : L.seat) : "AGENT";
    PX.paint(document.getElementById("lookWho"), who);
    PX.paint(document.getElementById("lookItem"), "ITEM " + L.item);
    /* the file NAME only — never the path it came from */
    var base = String(L.rel).split(/[\\/]/).pop();
    wrap(base, 40, 1).forEach(function (l) { txt(t, l, "2", "orange", "0"); });
    wrap(L.title, 44, 2).forEach(function (l) { txt(t, l, "2", "bone", "0"); });
  }

  /* Each board draws inside its own guard. This runs unattended on a live
     stream: one board throwing on a shape the API has not shown before must
     not take the other three down with it, which is exactly what an
     unguarded sequence did. */
  function safe(name, fn) {
    try { fn(); }
    catch (e) { if (window.console) console.error("[deck] " + name + " failed:", e); }
  }
  function paint() {
    safe("crew", drawCrew);
    safe("looking", drawLooking);
    safe("critique", drawCritique);
    safe("feed", drawFeed);
    safe("header", updateHeader);
    if (takeover && !PIN) { takeover = false; interrupt(); }
  }

  /* Jump to CRITIQUE, hold it longer than a normal turn, then resume the
     rotation from the next board. */
  function critiqueIdx() {
    for (var i = 0; i < BOARDS.length; i++) if (BOARDS[i].key === "critique") return i;
    return 0;
  }
  function interrupt() {
    show(critiqueIdx());
    clearTimeout(rotTimer);
    rotTimer = setTimeout(rotate, CRIT_HOLD);
  }
  /* Skip boards with nothing true to show. Falls back to the current board if
     every one opts out, so the deck can never go blank. */
  function nextLive(from) {
    for (var n = 1; n <= BOARDS.length; n++) {
      var i = (from + n) % BOARDS.length;
      if (boardLive(BOARDS[i].key)) return i;
    }
    return from;
  }
  function rotate() {
    show(nextLive(idx));
    clearTimeout(rotTimer);
    rotTimer = setTimeout(rotate, DWELL);
  }

  /* ── rotation ──────────────────────────────────────────────────────────── */
  function show(i) {
    idx = i % BOARDS.length;
    BOARDS.forEach(function (b, n) { b.el.classList.toggle("on", n === idx); });
    updateHeader();
    for (var n = 0; n < elPips.children.length; n++) {
      elPips.children[n].className = (n === idx ? "on" : "");
    }
  }

  refresh();
  setInterval(refresh, POLL);

  if (PIN) {
    var only = BOARDS.map(function (b) { return b.key; }).indexOf(PIN);
    show(only < 0 ? 0 : only);
  } else {
    show(0);
    rotTimer = setTimeout(rotate, DWELL);
  }
})();
</script>
</body>
</html>

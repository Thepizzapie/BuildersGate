       art-QA reviewer (empty everywhere, same cause as verdict), not the
       approval actor. This badge reports status truthfully and claims nothing
       about who decided. NEEDS YOUR CALL keys off awaiting_human, which is
       status=="candidate" — also dead while the gate is off, and correct to
       leave alone: it lights again the moment the gate comes back. */
    var v = (card.verdict || "").toLowerCase();
    var s = (card.status  || "").toLowerCase();
    var badge = v === "pass" ? { t:"PASS", k:"v-pass" }
              : v === "fail" ? { t:"FAIL", k:"v-fail" }
              : s === "approved"  ? { t:"APPROVED",  k:"v-pass" }
              : s === "rejected"  ? { t:"REJECTED",  k:"v-fail" }
              : s === "candidate" ? { t:"CANDIDATE", k:"v-none" }
              : { t:(s || "UNJUDGED").toUpperCase(), k:"v-none" };
    var state = badge.k;

    PX.paint(el.capL, "NEW ARTWORK");
    PX.paint(el.capR, badge.t);

    /* preview_url comes from the server ready-made. Never rebuilt from `path`,
       and `path` is never displayed. */
    if (card.preview_url) { el.shot.src = card.preview_url; el.shot.style.display = "block"; }
    else { el.shot.removeAttribute("src"); el.shot.style.display = "none"; }

    var nm = String(card.logical_name || "UNTITLED");
    if (card.revision) nm += " R" + card.revision;
    PX.paint(el.name, nm.slice(0, 26));

    var bits = [];
    if (card.kind) bits.push(card.kind);
    if (card.producer) bits.push(card.producer);
    PX.paint(el.meta, bits.join(" - ").slice(0, 46));

    var seat = card.seat || "";
    var crew = seat ? (window.agentName ? window.agentName(seat) : seat) : "UNFILED";
    PX.paint(el.who, seat ? (crew + " - " + seat) : crew);
    if (seat) {
      el.face.style.backgroundImage = "url('/static/img/agents/" + seat + "_talk.png')";
      el.face.parentNode.style.visibility = "visible";
    } else {
      el.face.parentNode.style.visibility = "hidden";
    }

    /* no verdict => no score meter. An unjudged card showing "0" reads as a
       zero score, which is exactly the confusion rule 3 warns about. */
    if (v === "pass" || v === "fail") {
      el.scoreRow.style.display = "flex";
      drawBars(card.score || 0);
      PX.paint(el.scoreNum, String(card.score || 0));
    } else {
      el.scoreRow.style.display = "none";
    }

    drawNote(card.note || (v ? "" : "NO QA VERDICT ON THIS ONE"));
    el.gate.style.display = card.awaiting_human ? "inline-flex" : "none";

    el.toast.className = "toast " + state + " up";
    showSprite(seat);
    el.sprite.className = "sprite up";

    clearTimeout(holdTimer);
    holdTimer = setTimeout(function () {
      el.toast.className  = "toast " + state + " down";
      el.sprite.className = "sprite down";
    }, HOLD);
  }

  /* ── feed ──────────────────────────────────────────────────────────────── */
  function demoCard() {
    return { seq: 999, logical_name: "I100C_PM_PALADIN", revision: 1,
             kind: "texture", producer: "image_generate", seat: "art",
             preview_url: "", verdict: "", score: 0, reviewer: "",
             note: "", awaiting_human: true };
  }

  function tick() {
    if (DEMO) { if (!cursor) { cursor = 999; render(demoCard()); } return; }

    fetch("/api/critique?since=" + cursor, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (env) {
        var d = (env && env.data) || {};
        /* Trust the server's yes/no. Do not diff payloads. */
        if (!d.new) return;
        var card = d.latest;
        if (!card) return;
        cursor = d.seq || card.seq || cursor;
        render(card);
      })
      .catch(function () { /* dashboard down — leave whatever is on screen */ });
  }

  tick();
  setInterval(tick, POLL);   /* polling only; nothing animates from JS */
})();
</script>
</body>
</html>

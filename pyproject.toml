[project]
name = "builders-gate"
version = "0.1.27"
description = "Agentic game development pipeline — design bible, lore canon, and DCC/engine adapters over MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thepizzapie" }]
keywords = ["gamedev", "mcp", "godot", "blender", "agents"]
requires-python = ">=3.11"
dependencies = [
    # PINNED BELOW 2. The MCP SDK's 2.0 removed `mcp.server.fastmcp` — the whole
    # of bgate_mcp/server.py is built on FastMCP, and 2.0 replaces it with
    # `mcp.server.mcpserver` under a different API. A floor with no ceiling meant
    # a clean install resolved to 2.0.0 and every MCP tool failed to import, on a
    # machine where nothing had changed but the date. Lifting this is a port,
    # not a version bump.
    "mcp>=1.2.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "Pillow>=10.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
stt = ["faster-whisper>=1.0"]
record = ["sounddevice>=0.4", "numpy>=1.26"]
# `bgate app` — the dashboard in a native window. On Windows this renders
# through the Edge WebView2 runtime that ships with 11, so the extra is one
# pure-Python package and no bundled browser.
desktop = ["pywebview>=5.0"]
# Building the downloadable BuildersGate.exe — see packaging/build_exe.py.
build = ["pyinstaller>=6.14", "pywebview>=5.0"]

[project.urls]
Homepage = "https://github.com/Thepizzapie/BuildersGate"
Issues = "https://github.com/Thepizzapie/BuildersGate/issues"

[project.scripts]
bgate = "bgate_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# bgate_engine and templates carry no .py at all — they are pure data trees that
# scaffold.py / godot_templates resolve RELATIVE TO THE INSTALL ROOT
# (bgate_core/../templates), so they must land next to the code packages in
# site-packages. namespaces = true is what lets those __init__-less dirs be
# collected; their contents come in via package-data below.
include = [
    "bgate_core*",
    "bgate_mcp*",
    "bgate_adapters*",
    "bgate_cli*",
    "bgate_site*",
    "bgate_ui*",
    "bgate_engine",
    "templates",
]
exclude = ["tests*", "docs*", "*.__pycache__"]
namespaces = true

[tool.setuptools.package-data]
# A wheel with no JS is a dashboard where every /static/**/*.js 404s, and a
# wheel with no templates/ is a scaffolder that raises FileNotFoundError. Both
# shipped that way until CI started asserting otherwise (see .github/workflows).
bgate_ui = ["static/**/*"]
# Same failure mode as the dashboard's JS: a wheel with no theme/ is a publish
# that writes an index.html with no stylesheet next to it.
bgate_site = ["theme/*"]
bgate_engine = ["*.md", "schemas/**/*"]
# `**/*` DOES NOT MATCH DOTFILES, and templates/shared/.gitignore is the file
# that stops a user committing their API key in the project this scaffolds.
# It has to be named explicitly or the wheel ships without it and the fix
# only works from a source checkout -- the same class of bug as the wheel
# that shipped with no JavaScript.
templates = ["**/*", "**/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits real Blender/whisper — deselect with -m 'not slow'",
]

[tool.ruff]
# Deliberately NOT ruff's default rule set. All rules on reports 1000+ findings
# here, most of them style opinions this codebase has already decided against
# (Optional[] over X|None, broad excepts that are load-bearing around
# subprocesses). A lint gate nobody can make green is a lint gate everyone
# learns to ignore.
#
# E9 + F is the subset that catches BUGS rather than taste: syntax errors,
# undefined names, unused imports, shadowed definitions. Turning it on found a
# function defined twice in items.py (the second silently winning) and an
# `Optional` that only survived because `from __future__ import annotations`
# makes annotations lazy strings.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Importing a pytest fixture and then naming it as a test parameter is the
# documented way to share fixtures across modules, and it looks exactly like a
# redefinition to a linter.
"tests/*" = ["F811"]

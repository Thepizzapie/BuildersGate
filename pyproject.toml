[project]
name = "builders-gate"
version = "0.1.43"
description = "Agentic game development pipeline — design bible, lore canon, and DCC/engine adapters over MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thepizzapie" }]
keywords = ["gamedev", "mcp", "godot", "blender", "agents"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "Pillow>=10.0",
    "numpy>=1.26",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.12,<0.13"]
stt = ["faster-whisper>=1.0"]
voice = ["websockets>=13"]
record = ["sounddevice>=0.4"]
stems = ["demucs>=4.1,<5"]
desktop = ["pywebview>=5.0", "comtypes>=1.2"]
floor = ["builders-gate-floor-assets"]
build = ["pyinstaller>=6.14", "pywebview>=5.0"]

[project.urls]
Homepage = "https://github.com/Thepizzapie/BuildersGate"
Issues = "https://github.com/Thepizzapie/BuildersGate/issues"

[project.scripts]
bgate = "bgate_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "bgate_core*",
    "bgate_mcp*",
    "bgate_adapters*",
    "bgate_cli*",
    "bgate_site*",
    "bgate_ui*",
    "templates",
]
exclude = ["tests*", "docs*", "*.__pycache__"]
namespaces = true

[tool.setuptools.package-data]
bgate_ui = ["static/**/*", "agents/prompts/*.txt"]
bgate_site = ["theme/*"]
templates = ["**/*", "**/.gitignore"]

[tool.setuptools.exclude-package-data]
bgate_ui = ["static/img/floor/*", "static/img/floor/**/*",
            "static/audio/floor/*", "static/audio/floor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits real Blender/whisper — deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

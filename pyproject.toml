[project]
name = "builders-gate"
version = "0.1.45"
description = "Agentic game development pipeline — design bible, lore canon, and DCC/engine adapters over MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thepizzapie" }]
keywords = ["gamedev", "mcp", "godot", "blender", "agents"]
requires-python = ">=3.11"
# FLOORS ARE A SECURITY CONTROL, NOT A FORMALITY. A floor is the oldest version
# a resolver may legally hand a user, so every one of these has to be at or
# above the release that fixed the last known advisory for that package —
# `pip install builders-gate` on a constrained resolver takes the floor, not the
# latest. security.yml audits BOTH: the resolved tree and these floors pinned
# exactly, because a floor-only vulnerability is invisible to the resolved run.
#
# uvicorn is >=0.31.1 because mcp requires it, not because uvicorn had a
# problem: the old >=0.29 floor could not resolve against mcp's own >=0.30 at
# all. starlette is DIRECT because bgate_ui imports it directly (api.py,
# redact.py) and because fastapi's floor alone does not reach the fixed line —
# fastapi <0.141 caps starlette below it.
dependencies = [
    "mcp>=1.28.1,<2",
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn>=0.31.1",
    "Pillow>=12.3.0",
    "numpy>=1.26",
    "openai>=1.30",
]

[project.optional-dependencies]
# ruff stays capped at <0.13 on purpose — a minor bump changes what the lint
# accepts — and no ruff in that range carries an advisory.
dev = ["pytest>=9.0.3", "httpx>=0.27.1", "ruff>=0.12,<0.13"]
stt = ["faster-whisper>=1.0"]
voice = ["websockets>=13"]
record = ["sounddevice>=0.4"]
stems = ["demucs>=4.1,<5"]
desktop = ["pywebview>=5.0", "comtypes>=1.2"]
floor = ["builders-gate-floor-assets"]
build = ["pyinstaller>=6.14", "pywebview>=5.0"]
# The web engine's screenshot path. TWO installs, not one: this brings the
# package, and `playwright install chromium` brings the browser it drives.
# doctor's playwright row reports them apart because they fail apart.
web = ["playwright>=1.47"]

[project.urls]
Homepage = "https://github.com/Thepizzapie/BuildersGate"
Issues = "https://github.com/Thepizzapie/BuildersGate/issues"

[project.scripts]
bgate = "bgate_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "bgate_core*",
    "bgate_mcp*",
    "bgate_adapters*",
    "bgate_cli*",
    "bgate_site*",
    "bgate_ui*",
    "templates",
]
exclude = ["tests*", "docs*", "*.__pycache__"]
namespaces = true

[tool.setuptools.package-data]
bgate_ui = ["static/**/*", "agents/prompts/*.txt"]
bgate_site = ["theme/*"]
templates = ["**/*", "**/.gitignore"]

[tool.setuptools.exclude-package-data]
bgate_ui = ["static/img/floor/*", "static/img/floor/**/*",
            "static/audio/floor/*", "static/audio/floor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits real Blender/whisper — deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

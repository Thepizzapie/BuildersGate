; Builders Gate — the Web export preset every project ships with.
;
; This exists so `bgate publish` (and the dashboard's /play tab) never has to
; ask a human to open the editor and click through Project > Export first. The
; export was previously blocked on "the tech seat must create the Web preset",
; which is a manual step standing between a finished game and a URL.
;
; thread_support is OFF on purpose. Threaded Web builds need SharedArrayBuffer,
; which needs cross-origin isolation headers on the HOST — free static hosts
; that cannot set headers (and iOS Safari) then serve a blank canvas. The
; no-threads build runs anywhere. `bgate publish` still writes COOP/COEP headers
; for hosts that honour them, so turning this on later is a one-line change here
; and a re-export, not a hosting migration.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
